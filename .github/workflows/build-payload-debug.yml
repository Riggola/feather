
name: Feather Payload Debug IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 60

    permissions:
      contents: read

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 26.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Reset Swift package resolution
        run: |
          echo "Existing Package.resolved files:"
          find . -name Package.resolved -print

          echo "Removing resolved files for this CI run:"
          find . -name Package.resolved -type f -delete

          rm -rf "$HOME/Library/Caches/org.swift.swiftpm"
          rm -rf "$RUNNER_TEMP/FeatherPackages"

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -workspace Feather.xcworkspace \
            -scheme Feather \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/FeatherPackages" \
            -scmProvider system \
            -skipPackagePluginValidation

      - name: Build Feather for iPhone
        run: |
          xcodebuild \
            -workspace Feather.xcworkspace \
            -scheme Feather \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/FeatherBuild" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/FeatherPackages" \
            -disableAutomaticPackageResolution \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=NO \
            build

      - name: Package IPA
        run: |
          APP_PATH="$RUNNER_TEMP/FeatherBuild/Build/Products/Release-iphoneos/Feather.app"

          test -d "$APP_PATH"

          mkdir -p output/Payload
          cp -R "$APP_PATH" output/Payload/Feather.app

          codesign --force --sign - --timestamp=none \
            output/Payload/Feather.app

          ditto -c -k --sequesterRsrc --keepParent \
            output/Payload \
            output/Feather-Payload-Debug-Unsigned.ipa

          ls -lh output/Feather-Payload-Debug-Unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Feather-Payload-Debug-Unsigned
          path: output/Feather-Payload-Debug-Unsigned.ipa
          if-no-files-found: error
          retention-days: 14
